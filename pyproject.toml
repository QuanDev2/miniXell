[project]
name = "minixell"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.13.4",
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "pyarrow>=26.0.0",
    "pymongo>=4.19.0",
    "pyspark>=4.2.0",
    "scanpy>=1.12.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]  # correctness only: syntax errors, bad comparisons, misplaced statements, undefined names

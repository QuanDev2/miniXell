[project]
name = "minixell"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.13.4",
    "fastapi>=0.162.0",
    "pyarrow>=26.0.0",
    "pymongo>=4.19.0",
    "pyspark>=4.2.0",
    "scanpy>=1.12.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
